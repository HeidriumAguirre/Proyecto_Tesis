services:
  db_relacional:
    image: mysql:8.0
    container_name: mysql_its_math
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD_required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-its_murialdo}
    # En produccion NO exponemos el puerto 3306 al host;
    # solo accesible desde la red interna de Docker (its_net_backend).
    # Si necesitas admin externo, usa un tunel SSH o quita el comentario.
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - its_net_backend
    deploy:
      resources:
        limits:
          memory: 512M

  app_tutor:
    build: .
    container_name: streamlit_its_math
    restart: on-failure
    depends_on:
      db_relacional:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: db_relacional
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-its_murialdo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY_required}
      # Para produccion, Caddy hace el TLS termination.
      # Streamlit escucha internamente en HTTP en el puerto 8501.
      STREAMLIT_SERVER_PORT: "8501"
    # No exponemos el puerto al host: Caddy (en la red its_net_frontend)
    # es el unico que habla HTTP con el exterior.
    expose:
      - "8501"
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - its_net_backend
      - its_net_frontend
    deploy:
      resources:
        limits:
          memory: 1024M

  # Reverse proxy con HTTPS automatico via Let's Encrypt.
  # Unico servicio expuesto al exterior (puertos 80 y 443).
  caddy:
    image: caddy:2-alpine
    container_name: caddy_its_math
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - its_net_frontend
    depends_on:
      - app_tutor
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mysql_data:
  chroma_data:
  caddy_data:
  caddy_config:

networks:
  its_net_backend:
    driver: bridge
    internal: true   # MySQL y Streamlit NO son accesibles desde el host;
                     # solo entre servicios de Docker.
  its_net_frontend:
    driver: bridge
    # Caddy (puertos 80/443) y app_tutor (puerto 8501 interno).
